version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file: ./backend/.env.example # In production, use a real .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/whatsapp_auth
      - JWT_SECRET=your_jwt_secret
    depends_on:
      - mongodb
    networks:
      - auth-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - auth-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - auth-network

networks:
  auth-network:
    driver: bridge

volumes:
  mongo-data:
