server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_frontend frontend;
        proxy_pass http://$upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        set $upstream_admin admin-frontend;
        rewrite ^/admin/(.*) /$1 break;
        proxy_pass http://$upstream_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        set $upstream_api api;
        proxy_pass http://$upstream_api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io/ {
        set $upstream_socket api;
        proxy_pass http://$upstream_socket:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /traccar/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8082/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard proxy settings
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        # Handle redirects from Traccar backend
        proxy_redirect http://$upstream_backend:8082/ /traccar/;
        proxy_redirect / /traccar/;
    }

}
